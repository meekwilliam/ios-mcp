name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: ios-mcp-windows
          path: target/release/ios-mcp.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: cargo test --release
      - name: Build a universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output ios-mcp target/aarch64-apple-darwin/release/ios-mcp target/x86_64-apple-darwin/release/ios-mcp
      - uses: actions/upload-artifact@v7
        with:
          name: ios-mcp-mac
          path: ios-mcp
