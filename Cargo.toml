[package]
name = "ios-mcp"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Lets AI agents see and control a real iPhone from Mac or Windows, over MCP, with no Xcode and no app on the phone"
repository = "https://github.com/meekwilliam/ios-mcp"

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring",
    "usbmuxd",
    "core_device",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "rsd",
    "xpc",
    "display_stream",
    "mobile_image_mounter",
    "tss",
    "amfi",
    "dvt",
] }
tokio = { version = "1.54", features = ["rt-multi-thread", "rt", "macros", "fs", "time", "sync", "io-std", "io-util"] }
plist = "1.10"
ns-keyed-archive = "0.1.5"
flate2 = "1.1"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3"
openh264 = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
